services:
  steemvm:
    image: golang:1.26.5-trixie
    container_name: steemvm-node
    working_dir: /workspace
    restart: unless-stopped
    environment:
      GOPATH: /root/go
      CGO_ENABLED: "1"
      # cosmovisor: run the node under cosmovisor so it auto-swaps to a staged
      # upgrade binary exactly at a future governance upgrade height (no manual
      # action at the block, ~no downtime).
      DAEMON_HOME: /root/.steemvm
      DAEMON_NAME: steemvmd
      DAEMON_RESTART_AFTER_UPGRADE: "true"
      DAEMON_ALLOW_DOWNLOAD_BINARIES: "false"
      UNSAFE_SKIP_BACKUP: "true"
    volumes:
      - .:/workspace
      # Bind-mounts your REAL node home (default $HOME/.steemvm, override with
      # STEEMVM_HOME) instead of a Docker-managed volume. This is a
      # single-validator chain: the running node's priv_validator_key.json
      # MUST be the exact key whose consensus pubkey is bonded in the genesis
      # gentx (see Instructions/GENESIS_VALIDATOR_SETUP.md). A fresh identity
      # generated inside an isolated volume would never match that gentx and
      # could never sign/produce a block on this chain.
      - ${STEEMVM_HOME:-${HOME}/.steemvm}:/root/.steemvm
      - gopath:/root/go
      - go-build-cache:/root/.cache/go-build
    ports:
      - "8545:8545"   # EVM JSON-RPC (http)
      - "8546:8546"   # EVM JSON-RPC (websocket)
      - "26656:26656" # CometBFT p2p
      - "26657:26657" # CometBFT RPC
      - "1317:1317"   # Cosmos REST API
      - "9090:9090"   # gRPC
    command:
      - sh
      - -ec
      - |
        git config --global --add safe.directory /workspace
        # Run under cosmovisor so the node auto-swaps to the staged upgrade binary
        # at the governance upgrade height. cosmovisor + steemvmd both build from
        # this checkout via `make install`.
        # GOTOOLCHAIN pinned to this repo's own `go` directive for JUST this install:
        # cosmovisor v1.7.0's own dependency graph pulls in an old bytedance/sonic
        # whose assembly doesn't link under the image's Go 1.26 toolchain (unrelated
        # to this app's own build, which isn't affected — see go.mod's sonic replace).
        [ -x /root/go/bin/cosmovisor ] || GOTOOLCHAIN=go1.25.10 go install cosmossdk.io/tools/cosmovisor/cmd/cosmovisor@v1.7.0
        make install
        # Only bootstraps a brand-new identity if the bind-mounted home is
        # genuinely empty. An already-bootstrapped validator's real keys are
        # never touched or regenerated.
        FRESH_HOME=0
        if [ ! -f /root/.steemvm/config/priv_validator_key.json ]; then
          FRESH_HOME=1
          # `init` always writes ITS OWN placeholder genesis as a side effect
          # of generating priv_validator_key.json, even on a fresh home — that
          # placeholder must never win. If a caller (e.g. new-validator.sh,
          # which fetches the live network genesis before this container ever
          # starts) already staged a real genesis.json here, preserve it
          # across the init call (which needs --overwrite so it doesn't choke
          # on a pre-staged file) rather than letting init's own default
          # clobber it; otherwise fall back to the tracked Instructions/ copy.
          [ -f /root/.steemvm/config/genesis.json ] && mv /root/.steemvm/config/genesis.json /root/.steemvm/config/genesis.json.staged
          /root/go/bin/steemvmd init node --chain-id steemvm --home /root/.steemvm --overwrite
          if [ -f /root/.steemvm/config/genesis.json.staged ]; then
            mv /root/.steemvm/config/genesis.json.staged /root/.steemvm/config/genesis.json
          else
            cp /workspace/Instructions/genesis.json /root/.steemvm/config/genesis.json
          fi
        fi
        # app.toml/config.toml are per-validator (gitignored). Seed them from the
        # tracked *.example templates, and seed the node's own config/ from those,
        # but ONLY if not already present — never overwrite a real validator's
        # already-tuned config.
        [ -f /workspace/Instructions/app.toml ]    || cp /workspace/Instructions/app.toml.example   /workspace/Instructions/app.toml
        [ -f /workspace/Instructions/config.toml ] || cp /workspace/Instructions/config.toml.example /workspace/Instructions/config.toml
        [ -f /root/.steemvm/config/app.toml ]      || cp /workspace/Instructions/app.toml    /root/.steemvm/config/app.toml
        [ -f /root/.steemvm/config/config.toml ]   || cp /workspace/Instructions/config.toml /root/.steemvm/config/config.toml
        [ -f /root/.steemvm/config/client.toml ]   || cp /workspace/Instructions/client.toml /root/.steemvm/config/client.toml
        # cosmovisor layout: the launch binary lives in genesis/bin and runs from
        # block 1. On a fresh chain this bootstraps to THIS build; on a later
        # governance upgrade cosmovisor swaps to the staged binary at its height.
        mkdir -p /root/.steemvm/cosmovisor/genesis/bin
        [ -f /root/.steemvm/cosmovisor/genesis/bin/steemvmd ] || cp /root/go/bin/steemvmd /root/.steemvm/cosmovisor/genesis/bin/steemvmd
        # Stage the freshly-built binary under its own stamped version name too.
        # cosmovisor swaps to it only when an on-chain plan of that exact name
        # reaches its height, so a mismatched build can't be mis-staged.
        VER="$$(/root/go/bin/steemvmd version 2>/dev/null)"
        if [ -n "$$VER" ]; then
          mkdir -p "/root/.steemvm/cosmovisor/upgrades/v$$VER/bin"
          cp /root/go/bin/steemvmd "/root/.steemvm/cosmovisor/upgrades/v$$VER/bin/steemvmd"
        fi
        # Explicit 0.0.0.0 bindings on every server regardless of what's baked
        # into app.toml/config.toml (CLI flags always win) — this is what makes
        # the ports published above actually reachable from outside the
        # container, matching Instructions/app.toml.example's own bindings.
        exec /root/go/bin/cosmovisor run start \
          --home /root/.steemvm \
          --rpc.laddr tcp://0.0.0.0:26657 \
          --grpc.enable --grpc.address 0.0.0.0:9090 \
          --grpc-web.enable \
          --api.enable \
          --json-rpc.enable \
          --json-rpc.address "0.0.0.0:8545" \
          --json-rpc.ws-address "0.0.0.0:8546" \
          --json-rpc.api "eth,net,web3,txpool,debug" \
          --json-rpc.enable-indexer

  # Standalone Steem bridge oracle — pick ONE language and bring it up with its
  # profile (never more than one at a time; they'd race on the same signing key
  # and scan cursor):
  #
  #     cp oracle/.env.example oracle/.env    # then edit oracle/.env (your key)
  #     docker compose --profile go up -d       # or --profile python / --profile js
  #
  # All oracle config (incl. your validator key, CoinMarketCap key, and the
  # Steem RPC used for both bridge scanning and price feeds) comes from
  # oracle/.env — see oracle/.env.example. That file is gitignored; NEVER
  # commit it. Bridge-attestation txs are fee-exempt for bonded validators;
  # price-feed txs are NOT (see oracle/PROTOCOL.md) and need a funded account.
  # If oracle/.env has no key, the client just restart-loops harmlessly
  # ("provide the signing key") until you add one — the node is unaffected.
  oracle-go:
    build:
      context: .
      dockerfile: oracle/go/Dockerfile
    container_name: steemvm-oracle-go
    depends_on:
      - steemvm
    restart: unless-stopped
    env_file:
      - path: oracle/.env
        required: false
    volumes:
      - oracle-data:/oracle-data
    profiles: ["go"]

  oracle-python:
    build:
      context: ./oracle/python
      dockerfile: Dockerfile
    container_name: steemvm-oracle-python
    depends_on:
      - steemvm
    restart: unless-stopped
    env_file:
      - path: oracle/.env
        required: false
    volumes:
      - oracle-data:/oracle-data
    profiles: ["python"]

  oracle-js:
    build:
      context: ./oracle/js
      dockerfile: Dockerfile
    container_name: steemvm-oracle-js
    depends_on:
      - steemvm
    restart: unless-stopped
    env_file:
      - path: oracle/.env
        required: false
    volumes:
      - oracle-data:/oracle-data
    profiles: ["js"]

volumes:
  oracle-data:
  gopath:
  go-build-cache:
