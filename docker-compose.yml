services:
  steemvm:
    # Pre-built image (see Dockerfile) — no more `make install` inside the
    # container on every start. Defaults to the published v0.0.4-1 image
    # (cosmos/evm + cosmos-sdk security patches, withdrawal-payout
    # enforcement, CoinGecko price source — see
    # Instructions/UPGRADE_v0.0.4.md). Override with STEEMVM_IMAGE (env var
    # or repo-root .env) to point at a different tag: STEEMVM_IMAGE=you/steemvmd:tag
    #
    # v0.0.4-1 is a DEPENDENCY-ONLY security rebuild of v0.0.4 — newer Go
    # toolchain, cosmovisor v1.7.3, refreshed golang.org/x/* — with zero
    # application or consensus changes. It still reports `version 0.0.4` on
    # purpose (see SECURITY.md): the on-chain upgrade name must keep matching,
    # and docker-entrypoint.sh stages by that version string. Tell the two
    # apart with `steemvmd version --long`: go1.26.8 = patched, go1.26.5 = not.
    #
    # v0.0.5 ROLLOUT IN PROGRESS — this default deliberately STAYS on v0.0.4-1
    # until the coordinated v0.0.5 upgrade has applied on-chain. Stage v0.0.5
    # with the `stage-v0.0.5` service below instead:
    #
    #     docker compose --profile stage run --rm stage-v0.0.5
    #
    # Why not just bump this to v0.0.5: every validator created after the
    # v0.0.4 height still has cosmovisor's `current` pointing at `genesis`,
    # and docker-entrypoint.sh refreshes genesis/bin from the image on every
    # start. Running the v0.0.5 image here early would make cosmovisor run
    # v0.0.5 immediately; once the upgrade plan is scheduled, x/upgrade then
    # refuses to run ("BINARY UPDATED BEFORE TRIGGER") and that node halts
    # and gets jailed. Keeping this on v0.0.4-1 makes an accidental
    # `docker compose pull && up -d` harmless. Flip it to v0.0.5 (and drop
    # the stage service) only once `steemvmd query upgrade applied v0.0.5`
    # succeeds. See Instructions/UPGRADE_v0.0.5.md.
    #
    # `docker compose up -d` alone still works with zero setup: if the image
    # named below isn't already pulled, compose falls back to building it
    # locally from ./Dockerfile (same as always, just now cached properly
    # instead of rebuilding from scratch every start).
    image: ${STEEMVM_IMAGE:-steemblazer/steemvmd:v0.0.4-1}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steemvm-node
    working_dir: /workspace
    restart: unless-stopped
    environment:
      # cosmovisor: run the node under cosmovisor so it auto-swaps to a staged
      # upgrade binary exactly at a future governance upgrade height (no manual
      # action at the block, ~no downtime).
      DAEMON_HOME: /root/.steemvm
      DAEMON_NAME: steemvmd
      DAEMON_RESTART_AFTER_UPGRADE: "true"
      DAEMON_ALLOW_DOWNLOAD_BINARIES: "false"
      UNSAFE_SKIP_BACKUP: "true"
    volumes:
      - .:/workspace
      # Bind-mounts your REAL node home (default $HOME/.steemvm, override with
      # STEEMVM_HOME) instead of a Docker-managed volume. This is a
      # single-validator chain: the running node's priv_validator_key.json
      # MUST be the exact key whose consensus pubkey is bonded in the genesis
      # gentx. A fresh identity
      # generated inside an isolated volume would never match that gentx and
      # could never sign/produce a block on this chain.
      - ${STEEMVM_HOME:-${HOME}/.steemvm}:/root/.steemvm
    # Everything binds to LOCALHOST ONLY except p2p. A validator has no reason
    # to expose RPC/API/gRPC to the internet: those are query+tx surfaces and a
    # DoS vector. p2p (26656) is the one port that MUST be world-reachable —
    # it's how the node gossips blocks with other validators.
    #
    # To serve any of these publicly (public RPC provider), do NOT widen the
    # bind here — put nginx in front as a TLS-terminating proxy to the
    # 127.0.0.1 ports (Instructions/nginx.conf, and section 12 of
    # Instructions/README.md).
    #
    # Oracle clients are unaffected: they reach the node at http://steemvm:26657
    # over the compose network, which bypasses published ports entirely. So are
    # new-validator.sh / update.sh / reset.sh, which query the local node with
    # `docker exec`, not a host-side curl.
    ports:
      - "127.0.0.1:8545:8545"    # EVM JSON-RPC (http)
      - "127.0.0.1:8546:8546"    # EVM JSON-RPC (websocket)
      - "26656:26656"            # CometBFT p2p — PUBLIC on purpose, do not narrow
      - "127.0.0.1:26657:26657"  # CometBFT RPC
      - "127.0.0.1:1317:1317"    # Cosmos REST API
      - "127.0.0.1:9090:9090"    # gRPC

  # One-off: stage the v0.0.5 binary into cosmovisor's upgrade slot WITHOUT
  # running it or touching the live node. cosmovisor swaps to it on its own at
  # the upgrade height. It never writes cosmovisor/genesis or `current`, so it
  # is safe on any node, whichever way `current` points. Uses its own image
  # variable (not STEEMVM_IMAGE) so an operator override of the live image
  # can't stage the wrong binary — and it refuses to stage anything that
  # doesn't report version 0.0.5.
  #
  #     docker compose --profile stage run --rm stage-v0.0.5
  stage-v0.0.5:
    image: ${STEEMVM_STAGE_IMAGE:-steemblazer/steemvmd:v0.0.5}
    # Always fetch the published image: an older build cached from an earlier
    # pull reports the same "0.0.5" version but would split this node off the
    # network at the upgrade height.
    pull_policy: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ver="$$(/root/go/bin/steemvmd version)"
        if [ "$$ver" != "0.0.5" ]; then
          echo "refusing to stage: image reports version '$$ver', expected 0.0.5" >&2
          exit 1
        fi
        d=/root/.steemvm/cosmovisor/upgrades/v0.0.5/bin
        mkdir -p "$$d"
        if [ -f "$$d/steemvmd" ] && [ "$$(sha256sum < "$$d/steemvmd")" = "$$(sha256sum < /root/go/bin/steemvmd)" ]; then
          echo "already staged (identical binary)"
        else
          # Copy, then rename over: once cosmovisor RUNS this binary (after the
          # upgrade height), a plain cp onto it fails with "Text file busy".
          cp /root/go/bin/steemvmd "$$d/.steemvmd.new"
          mv -f "$$d/.steemvmd.new" "$$d/steemvmd"
        fi
        echo "staged: $$("$$d/steemvmd" version) -> cosmovisor/upgrades/v0.0.5/bin/steemvmd"
        echo "sha256: $$(sha256sum /root/.steemvm/cosmovisor/upgrades/v0.0.5/bin/steemvmd | cut -d' ' -f1)  (compare with the value in the upgrade announcement)"
    volumes:
      - ${STEEMVM_HOME:-${HOME}/.steemvm}:/root/.steemvm
    profiles: ["stage"]

  # Standalone Steem bridge oracle — pick ONE language and bring it up with its
  # profile (never more than one at a time; they'd race on the same signing key
  # and scan cursor):
  #
  #     cp oracle/.env.example oracle/.env    # then edit oracle/.env (your key)
  #     docker compose --profile go up -d       # or --profile python / --profile js
  #
  # All oracle config (incl. your validator key, price-source API key, and the
  # Steem RPC used for both bridge scanning and price feeds) comes from
  # oracle/.env — see oracle/.env.example. That file is gitignored; NEVER
  # commit it. Bridge-attestation txs are fee-exempt for bonded validators;
  # price-feed txs are NOT (see oracle/PROTOCOL.md) and need a funded account.
  # If oracle/.env has no key, the client just restart-loops harmlessly
  # ("provide the signing key") until you add one — the node is unaffected.
  # Each oracle service defaults to its published image (no local build unless
  # that image can't be pulled — same pull-or-fallback-build pattern as the
  # `steemvm` service above). Override with ORACLE_GO_IMAGE / ORACLE_PYTHON_IMAGE
  # / ORACLE_JS_IMAGE (env var or repo-root .env) to point at a different tag.
  oracle-go:
    image: ${ORACLE_GO_IMAGE:-steemblazer/steemvm-oracle-go:latest}
    build:
      context: .
      dockerfile: oracle/go/Dockerfile
    container_name: steemvm-oracle-go
    depends_on:
      - steemvm
    restart: unless-stopped
    env_file:
      - path: oracle/.env
        required: false
    volumes:
      - oracle-data:/oracle-data
    profiles: ["go"]

  oracle-python:
    image: ${ORACLE_PYTHON_IMAGE:-steemblazer/steemvm-oracle-python:latest}
    build:
      context: ./oracle/python
      dockerfile: Dockerfile
    container_name: steemvm-oracle-python
    depends_on:
      - steemvm
    restart: unless-stopped
    env_file:
      - path: oracle/.env
        required: false
    volumes:
      - oracle-data:/oracle-data
    profiles: ["python"]

  oracle-js:
    image: ${ORACLE_JS_IMAGE:-steemblazer/steemvm-oracle-js:latest}
    build:
      context: ./oracle/js
      dockerfile: Dockerfile
    container_name: steemvm-oracle-js
    depends_on:
      - steemvm
    restart: unless-stopped
    env_file:
      - path: oracle/.env
        required: false
    volumes:
      - oracle-data:/oracle-data
    profiles: ["js"]

volumes:
  oracle-data:
