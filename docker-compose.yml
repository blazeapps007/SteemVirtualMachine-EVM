services:
  steemvm:
    image: golang:1.26.5-trixie
    container_name: steemvm-node
    working_dir: /workspace
    restart: unless-stopped
    environment:
      GOPATH: /root/go
      CGO_ENABLED: "1"
      # cosmovisor: run the node under cosmovisor so it auto-swaps to a staged
      # upgrade binary exactly at a future governance upgrade height (no manual
      # action at the block, ~no downtime).
      DAEMON_HOME: /root/.steemvm
      DAEMON_NAME: steemvmd
      DAEMON_RESTART_AFTER_UPGRADE: "true"
      DAEMON_ALLOW_DOWNLOAD_BINARIES: "false"
      UNSAFE_SKIP_BACKUP: "true"
    volumes:
      - .:/workspace
      - steemvm-home:/root/.steemvm
      - gopath:/root/go
      - go-build-cache:/root/.cache/go-build
    ports:
      - "8545:8545"   # EVM JSON-RPC (http)
      - "8546:8546"   # EVM JSON-RPC (websocket)
      - "26656:26656" # CometBFT p2p
      - "26657:26657" # CometBFT RPC
      - "1317:1317"   # Cosmos REST API
      - "9090:9090"   # gRPC
    command:
      - sh
      - -ec
      - |
        git config --global --add safe.directory /workspace
        # Run under cosmovisor so the node auto-swaps to the staged upgrade binary
        # at the governance upgrade height. cosmovisor + steemvmd both build from
        # this checkout via `make install`.
        [ -x /root/go/bin/cosmovisor ] || go install cosmossdk.io/tools/cosmovisor/cmd/cosmovisor@v1.7.0
        make install
        if [ ! -f /root/.steemvm/config/priv_validator_key.json ]; then
          /root/go/bin/steemvmd init node --chain-id steemvm --home /root/.steemvm
        fi
        # app.toml/config.toml are per-validator (gitignored). Seed them from the
        # tracked *.example templates on first run; your local edits persist after.
        # (Explicit paths only, except the cosmovisor staging below, which escapes
        # shell vars as $$ so docker compose does not eat them.)
        [ -f /workspace/Instructions/app.toml ]   || cp /workspace/Instructions/app.toml.example   /workspace/Instructions/app.toml
        [ -f /workspace/Instructions/config.toml ] || cp /workspace/Instructions/config.toml.example /workspace/Instructions/config.toml
        rm -f /root/.steemvm/config/app.toml /root/.steemvm/config/config.toml /root/.steemvm/config/client.toml /root/.steemvm/config/genesis.json
        cp /workspace/Instructions/app.toml /workspace/Instructions/config.toml /workspace/Instructions/client.toml /root/.steemvm/config/
        cp /workspace/Instructions/genesis.json /root/.steemvm/config/genesis.json
        # cosmovisor layout: the launch binary lives in genesis/bin and runs from
        # block 1. On a fresh chain this bootstraps to THIS build; on a later
        # governance upgrade cosmovisor swaps to the staged binary at its height.
        mkdir -p /root/.steemvm/cosmovisor/genesis/bin
        [ -f /root/.steemvm/cosmovisor/genesis/bin/steemvmd ] || cp /root/go/bin/steemvmd /root/.steemvm/cosmovisor/genesis/bin/steemvmd
        # Stage the freshly-built binary under its own stamped version name too.
        # cosmovisor swaps to it only when an on-chain plan of that exact name
        # reaches its height, so a mismatched build can't be mis-staged.
        VER="$$(/root/go/bin/steemvmd version 2>/dev/null)"
        if [ -n "$$VER" ]; then
          mkdir -p "/root/.steemvm/cosmovisor/upgrades/v$$VER/bin"
          cp /root/go/bin/steemvmd "/root/.steemvm/cosmovisor/upgrades/v$$VER/bin/steemvmd"
        fi
        exec /root/go/bin/cosmovisor run start \
          --home /root/.steemvm \
          --json-rpc.enable \
          --json-rpc.address "0.0.0.0:8545" \
          --json-rpc.api "eth,net,web3,txpool,debug" \
          --json-rpc.enable-indexer

  # Standalone Steem bridge oracle. Starts by default alongside the node:
  #     cp oracle/.env.example oracle/.env    # then edit oracle/.env (your key)
  #     docker compose up -d
  #
  # All oracle config (incl. your validator key) comes from oracle/.env — see
  # oracle/.env.example. That file is gitignored; NEVER commit it. Only a bonded
  # validator's attestations count and are fee-exempt. If oracle/.env has no key,
  # the oracle just restart-loops harmlessly ("provide the signing key") until you
  # add one — the node is unaffected.
  oracle:
    image: golang:1.26.5-trixie
    container_name: steemvm-oracle
    working_dir: /workspace
    depends_on:
      - steemvm
    restart: unless-stopped
    env_file:
      - path: oracle/.env
        required: false
    environment:
      GOPATH: /root/go
      CGO_ENABLED: "1"
    volumes:
      - .:/workspace
      - oracle-data:/oracle-data
      - gopath:/root/go
      - go-build-cache:/root/.cache/go-build
    command:
      - sh
      - -ec
      - |
        git config --global --add safe.directory /workspace
        go build -o /usr/local/bin/steem-oracle ./oracle
        exec steem-oracle

volumes:
  steemvm-home:
  oracle-data:
  gopath:
  go-build-cache:
