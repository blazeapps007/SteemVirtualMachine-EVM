services:
  steemvm:
    # Pre-built image (see Dockerfile) — no more `make install` inside the
    # container on every start. Defaults to the published v0.0.4 image
    # (cosmos/evm + cosmos-sdk security patches, withdrawal-payout
    # enforcement, CoinGecko price source — see
    # Instructions/UPGRADE_v0.0.4.md). Override with STEEMVM_IMAGE (env var
    # or repo-root .env) to point at a different tag: STEEMVM_IMAGE=you/steemvmd:tag
    #
    # The v0.0.4 coordinated upgrade has already applied on-chain (confirmed
    # live: blazed007 et al. report version "0.0.4") — this is now simply
    # THE current image, safe for any validator (new or recovering-from-jail)
    # to `docker compose pull && up -d` normally, no special timing needed.
    # If/when the NEXT coordinated upgrade is prepared, re-add the "don't
    # pull early" guidance + a stage-vX.Y.Z one-off service (see git history
    # around the v0.0.4 rollout for the pattern) before bumping this default.
    #
    # `docker compose up -d` alone still works with zero setup: if the image
    # named below isn't already pulled, compose falls back to building it
    # locally from ./Dockerfile (same as always, just now cached properly
    # instead of rebuilding from scratch every start).
    image: ${STEEMVM_IMAGE:-steemblazer/steemvmd:v0.0.4}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steemvm-node
    working_dir: /workspace
    restart: unless-stopped
    environment:
      # cosmovisor: run the node under cosmovisor so it auto-swaps to a staged
      # upgrade binary exactly at a future governance upgrade height (no manual
      # action at the block, ~no downtime).
      DAEMON_HOME: /root/.steemvm
      DAEMON_NAME: steemvmd
      DAEMON_RESTART_AFTER_UPGRADE: "true"
      DAEMON_ALLOW_DOWNLOAD_BINARIES: "false"
      UNSAFE_SKIP_BACKUP: "true"
    volumes:
      - .:/workspace
      # Bind-mounts your REAL node home (default $HOME/.steemvm, override with
      # STEEMVM_HOME) instead of a Docker-managed volume. This is a
      # single-validator chain: the running node's priv_validator_key.json
      # MUST be the exact key whose consensus pubkey is bonded in the genesis
      # gentx (see Instructions/GENESIS_VALIDATOR_SETUP.md). A fresh identity
      # generated inside an isolated volume would never match that gentx and
      # could never sign/produce a block on this chain.
      - ${STEEMVM_HOME:-${HOME}/.steemvm}:/root/.steemvm
    ports:
      - "8545:8545"   # EVM JSON-RPC (http)
      - "8546:8546"   # EVM JSON-RPC (websocket)
      - "26656:26656" # CometBFT p2p
      - "26657:26657" # CometBFT RPC
      - "1317:1317"   # Cosmos REST API
      - "9090:9090"   # gRPC

  # Standalone Steem bridge oracle — pick ONE language and bring it up with its
  # profile (never more than one at a time; they'd race on the same signing key
  # and scan cursor):
  #
  #     cp oracle/.env.example oracle/.env    # then edit oracle/.env (your key)
  #     docker compose --profile go up -d       # or --profile python / --profile js
  #
  # All oracle config (incl. your validator key, price-source API key, and the
  # Steem RPC used for both bridge scanning and price feeds) comes from
  # oracle/.env — see oracle/.env.example. That file is gitignored; NEVER
  # commit it. Bridge-attestation txs are fee-exempt for bonded validators;
  # price-feed txs are NOT (see oracle/PROTOCOL.md) and need a funded account.
  # If oracle/.env has no key, the client just restart-loops harmlessly
  # ("provide the signing key") until you add one — the node is unaffected.
  oracle-go:
    build:
      context: .
      dockerfile: oracle/go/Dockerfile
    container_name: steemvm-oracle-go
    depends_on:
      - steemvm
    restart: unless-stopped
    env_file:
      - path: oracle/.env
        required: false
    volumes:
      - oracle-data:/oracle-data
    profiles: ["go"]

  oracle-python:
    build:
      context: ./oracle/python
      dockerfile: Dockerfile
    container_name: steemvm-oracle-python
    depends_on:
      - steemvm
    restart: unless-stopped
    env_file:
      - path: oracle/.env
        required: false
    volumes:
      - oracle-data:/oracle-data
    profiles: ["python"]

  oracle-js:
    build:
      context: ./oracle/js
      dockerfile: Dockerfile
    container_name: steemvm-oracle-js
    depends_on:
      - steemvm
    restart: unless-stopped
    env_file:
      - path: oracle/.env
        required: false
    volumes:
      - oracle-data:/oracle-data
    profiles: ["js"]

volumes:
  oracle-data:
