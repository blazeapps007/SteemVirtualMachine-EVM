services:
  steemvm:
    image: golang:1.26.5-trixie
    container_name: steemvm-node
    working_dir: /workspace
    environment:
      GOPATH: /root/go
      CGO_ENABLED: "1"
    volumes:
      - .:/workspace
      - steemvm-home:/root/.steemvm
      - gopath:/root/go
      - go-build-cache:/root/.cache/go-build
    ports:
      - "8545:8545"   # EVM JSON-RPC (http)
      - "8546:8546"   # EVM JSON-RPC (websocket)
      - "26656:26656" # CometBFT p2p
      - "26657:26657" # CometBFT RPC
      - "1317:1317"   # Cosmos REST API
      - "9090:9090"   # gRPC
    command:
      - sh
      - -ec
      - |
        git config --global --add safe.directory /workspace
        make install
        if [ ! -f /root/.steemvm/config/priv_validator_key.json ]; then
          /root/go/bin/steemvmd init node --chain-id steemvm --home /root/.steemvm
        fi
        # app.toml/config.toml are per-validator (gitignored). Seed them from the
        # tracked *.example templates on first run; your local edits persist after.
        # (No shell vars here — docker compose would substitute $VAR before the
        # container runs; explicit paths sidestep that entirely.)
        [ -f /workspace/Instructions/app.toml ]   || cp /workspace/Instructions/app.toml.example   /workspace/Instructions/app.toml
        [ -f /workspace/Instructions/config.toml ] || cp /workspace/Instructions/config.toml.example /workspace/Instructions/config.toml
        rm -f /root/.steemvm/config/app.toml /root/.steemvm/config/config.toml /root/.steemvm/config/client.toml /root/.steemvm/config/genesis.json
        cp /workspace/Instructions/app.toml /workspace/Instructions/config.toml /workspace/Instructions/client.toml /root/.steemvm/config/
        cp /workspace/Instructions/genesis.json /root/.steemvm/config/genesis.json
        exec /root/go/bin/steemvmd start \
          --home /root/.steemvm \
          --json-rpc.enable \
          --json-rpc.address "0.0.0.0:8545" \
          --json-rpc.api "eth,net,web3,txpool,debug" \
          --json-rpc.enable-indexer

  # Standalone Steem bridge oracle. Opt-in — it only starts with the "oracle"
  # profile, so a plain `docker compose up` runs just the node:
  #     docker compose --profile oracle up -d
  # (or set COMPOSE_PROFILES=oracle in a local .env to always include it).
  #
  # Supply your validator operator key via a gitignored .env file next to this
  # compose (ORACLE_PRIVATE_KEY or ORACLE_MNEMONIC) — NEVER commit it. Only a
  # bonded validator's attestations count and are fee-exempt.
  oracle:
    image: golang:1.26.5-trixie
    container_name: steemvm-oracle
    working_dir: /workspace
    profiles: ["oracle"]
    depends_on:
      - steemvm
    restart: unless-stopped
    environment:
      GOPATH: /root/go
      CGO_ENABLED: "1"
      ORACLE_STEEM_RPC: "${ORACLE_STEEM_RPC:-https://api.steemit.com}"
      ORACLE_NODE_RPC: "http://steemvm:26657"
      ORACLE_PRIVATE_KEY: "${ORACLE_PRIVATE_KEY:-}"
      ORACLE_MNEMONIC: "${ORACLE_MNEMONIC:-}"
    volumes:
      - .:/workspace
      - oracle-data:/oracle-data
      - gopath:/root/go
      - go-build-cache:/root/.cache/go-build
    command:
      - sh
      - -ec
      - |
        git config --global --add safe.directory /workspace
        go build -o /usr/local/bin/steem-oracle ./oracle
        exec steem-oracle

volumes:
  steemvm-home:
  oracle-data:
  gopath:
  go-build-cache:
