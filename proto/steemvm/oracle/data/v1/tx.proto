syntax = "proto3";
package steemvm.oracle.data.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "steemvm/oracle/data/v1/params.proto";

option go_package = "steemvm/x/oracle/data/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // AggregateExchangeRatePrevote submits the commit (hash) of a validator's
  // upcoming exchange-rate vote (bonded validators only).
  rpc AggregateExchangeRatePrevote(MsgAggregateExchangeRatePrevote) returns (MsgAggregateExchangeRatePrevoteResponse);

  // AggregateExchangeRateVote reveals a validator's exchange-rate vote,
  // verified against a prevote from an earlier vote period (bonded validators only).
  rpc AggregateExchangeRateVote(MsgAggregateExchangeRateVote) returns (MsgAggregateExchangeRateVoteResponse);

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// MsgAggregateExchangeRatePrevote commits a hash of the vote to be revealed.
message MsgAggregateExchangeRatePrevote {
  option (cosmos.msg.v1.signer) = "validator";
  // validator is the bech32 operator address of the voting validator.
  string validator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // hash is the truncated hex commit hash of (salt, exchange_rates, validator).
  string hash = 2;
}

// MsgAggregateExchangeRatePrevoteResponse defines the response type.
message MsgAggregateExchangeRatePrevoteResponse {}

// MsgAggregateExchangeRateVote reveals the salt and exchange rates that match a
// previously committed prevote hash.
message MsgAggregateExchangeRateVote {
  option (cosmos.msg.v1.signer) = "validator";
  // validator is the bech32 operator address of the voting validator.
  string validator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // salt is the reveal salt used to compute the prevote hash.
  string salt = 2;
  // exchange_rates is a comma-separated list of "PAIR:rate" entries,
  // e.g. "STEEM/USD:1.23,STEEM/SBD:0.98".
  string exchange_rates = 3;
}

// MsgAggregateExchangeRateVoteResponse defines the response type.
message MsgAggregateExchangeRateVoteResponse {}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "steemvm/x/oracle/data/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}
