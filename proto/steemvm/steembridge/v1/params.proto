syntax = "proto3";
package steemvm.steembridge.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "steemvm/x/oracle/bridge/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "steemvm/x/steembridge/Params";
  option (gogoproto.equal) = true;

  bool bridge_enabled = 1;
  bool bridge_out_enabled = 2;
  // gateway_account is DEPRECATED and no longer read by consensus logic —
  // the gateway account is a hardcoded Go constant (x/oracle/bridge/types.
  // GatewayAccount = "svm.bank"), never governance-settable. Kept on the
  // wire only so existing genesis/query output stays informative.
  string gateway_account = 3;
  string bridge_confirmation_threshold = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  uint64 minimum_bridge_amount = 5;
  uint64 maximum_bridge_amount = 6;
  uint64 deposit_timeout_blocks = 7;
  // name_service_enabled gates the Steem name-service flow (MsgSubmitNameRegistration /
  // MsgConfirmName). Independent of bridge_enabled; both features share gateway_account.
  bool name_service_enabled = 8;
  // name_registration_min_millisteem is the minimum Steem-side payment for a
  // name registration, in millisteem (1 = 0.001 STEEM).
  uint64 name_registration_min_millisteem = 9;
  // name_pending_timeout_blocks bounds both attestation (PENDING) and user
  // confirmation (AWAITING_CONFIRMATION) phases; the window restarts when the
  // registration reaches threshold.
  uint64 name_pending_timeout_blocks = 10;
  // relayer_start_block is the Steem anchor: the Steem block this chain
  // starts from (the Steem last irreversible block recorded at genesis).
  // Relayers never scan below it, and the chain rejects any deposit,
  // name-registration or withdrawal-payout attestation from an earlier Steem
  // block, so Steem history from before this chain existed (e.g. a previous
  // chain's deposits to the same gateway) can never be attested here.
  // 0 = no anchor: each relayer starts at Steem's LIB when it first boots and
  // nothing is rejected. Governance may move it forward, never back.
  uint64 relayer_start_block = 11;
  // bridge_fee_bps is the bridge fee in basis points (25 = 0.25%), applied to
  // both deposits and bridge-outs, for both assets. The fee is routed to the
  // staking reward pool. Must be <= 10000.
  uint32 bridge_fee_bps = 12;
  // withdrawal_timeout_blocks bounds how long a bridge-out withdrawal may sit
  // REQUESTED before it is automatically refunded (net amount re-minted and
  // returned to sender) with no validator attestation required — see
  // Keeper.RefundExpiredWithdrawals. Must be positive while bridge_out is
  // enabled.
  uint64 withdrawal_timeout_blocks = 13;
  // relayer_start_block_id is the Steem block ID (40 hex chars) of
  // relayer_start_block, recorded at genesis. A Steem block ID begins with its
  // block number, so the two are checked against each other. Relayers fetch
  // that block from their own Steem node and refuse to start if the ID
  // differs: the node is on another network, or the anchor was tampered with.
  // Empty when relayer_start_block is 0.
  string relayer_start_block_id = 14;
}
