syntax = "proto3";
package steemvm.steembridge.v1;

import "gogoproto/gogo.proto";
import "steemvm/steembridge/v1/asset.proto";
import "steemvm/steembridge/v1/deposit.proto";

option go_package = "steemvm/x/oracle/bridge/types";

// WithdrawalStatus is the lifecycle status of a withdrawal. REQUESTED is the
// bridge-out request (funds already burned); PROCESSED means bonded validators
// have attested (2/3) that the gateway paid the user on Steem; REFUNDED means
// no attestation reached threshold within Params.WithdrawalTimeoutBlocks, so
// the net amount was automatically re-minted and returned to sender (no
// validator attestation required for the refund itself — see
// Keeper.RefundExpiredWithdrawals). Both PROCESSED and REFUNDED are terminal:
// once set, the other can never also occur for the same withdrawal.
enum WithdrawalStatus {
  WITHDRAWAL_STATUS_REQUESTED = 0;
  WITHDRAWAL_STATUS_PROCESSED = 1;
  WITHDRAWAL_STATUS_REFUNDED = 2;
}

// Withdrawal defines the Withdrawal message.
message Withdrawal {
  uint64 id = 1;
  string sender = 2;
  string destination_steem_account = 3;
  // amount_asteem is the base-unit amount the sender burned (the DenomForAsset(asset)
  // amount; the field name is historical). amount_millisteem below is the NET payout.
  string amount_asteem = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false
  ];
  // amount_millisteem is the NET Steem-side payout (gross minus the bridge fee).
  uint64 amount_millisteem = 5;
  string memo = 6;
  string burn_tx_hash = 7;
  WithdrawalStatus status = 8;
  uint64 created_at = 9;
  // asset is which native Steem asset this withdrawal pays out (STEEM/SBD).
  BridgeAsset asset = 10;
  // fee_millisteem is the bridge fee withheld from the payout (gross - net).
  uint64 fee_millisteem = 11;
  // steem_payout_txid / payout_op_index reference the gateway's Steem payout, set
  // when the withdrawal is marked PROCESSED.
  string steem_payout_txid = 12;
  uint32 payout_op_index = 13;
  uint64 processed_at = 14;
  // validator_confirmations records the bonded validators that attested the payout.
  repeated Confirmation validator_confirmations = 15;
  // refunded_at is the SteemVM block height the automatic timeout refund ran,
  // set only when status becomes REFUNDED.
  uint64 refunded_at = 16;
}
